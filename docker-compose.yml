services:
  cc-analytics:
    container_name: cc-analytics
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Default: local only. On a remote/Tailscale host set CC_BIND=0.0.0.0 in .env
      - "${CC_BIND:-127.0.0.1}:6767:6767"
    environment:
      CC_ANALYTICS_DB_PATH: /data/analytics.db
      PORT: "6767"
      TZ: America/New_York
    volumes:
      - cc-analytics-data:/data
    restart: unless-stopped

volumes:
  cc-analytics-data:
